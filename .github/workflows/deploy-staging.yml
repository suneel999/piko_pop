name: Deploy Staging (AWS)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build Tailwind CSS
        run: |
          npm ci
          npm run build:css

      - name: Deploy to AWS staging
        env:
          SSH_HOST: ${{ secrets.AWS_STAGING_HOST }}
          SSH_USER: ${{ secrets.AWS_STAGING_USER }}
          SSH_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.AWS_STAGING_PATH || '/var/www/piko_pop' }}
        run: |
          set -euo pipefail

          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "Skip deploy: secrets not set."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"

          echo "Testing SSH..."
          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" "echo SSH OK"

          echo "Pulling latest code (no npm on server — saves RAM)..."
          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" \
            "set -euo pipefail
             sudo mkdir -p ${DEPLOY_PATH}
             sudo chown -R ${SSH_USER}:www-data ${DEPLOY_PATH}
             cd ${DEPLOY_PATH}
             if [ ! -d .git ]; then
               git clone -b staging https://github.com/suneel999/piko_pop.git ${DEPLOY_PATH}
             fi
             git remote set-url origin https://github.com/suneel999/piko_pop.git
             git fetch origin staging
             git checkout staging
             git reset --hard origin/staging"

          echo "Uploading built CSS..."
          scp $SSH_OPTS user_assets/css/output.css \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/user_assets/css/output.css"

          echo "Post-deploy..."
          ssh $SSH_OPTS "${SSH_USER}@${SSH_HOST}" \
            "sudo APP_DIR=${DEPLOY_PATH} bash ${DEPLOY_PATH}/deploy/aws/post-deploy.sh"

          echo "Deploy finished successfully."
