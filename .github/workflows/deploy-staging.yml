name: Deploy Staging (AWS)

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Deploy to AWS staging (SSH/rsync)
        env:
          SSH_HOST: ${{ secrets.AWS_STAGING_HOST }}
          SSH_USER: ${{ secrets.AWS_STAGING_USER }}
          SSH_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.AWS_STAGING_PATH || '/var/www/piko_pop' }}
        run: |
          set -euo pipefail

          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "Skip deploy: AWS_STAGING_HOST, AWS_STAGING_USER, or AWS_SSH_PRIVATE_KEY not set."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "Testing SSH connection..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" "echo SSH OK && whoami && ls -la ${DEPLOY_PATH} | head -5"

          echo "Preparing deploy permissions..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${SSH_USER}@${SSH_HOST}" \
            "sudo mkdir -p ${DEPLOY_PATH} && sudo chown -R ${SSH_USER}:www-data ${DEPLOY_PATH}"

          echo "Syncing files..."
          rsync -avz --delete \
            --rsync-path="sudo rsync" \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'deploy/deploy.config.json' \
            --exclude 'deploy/*.zip' \
            --exclude 'tmp/' \
            --exclude 'application/logs/' \
            --exclude 'uploads/' \
            --exclude '.claude' \
            --exclude 'zbit_local' \
            ./ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

          echo "Running post-deploy..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${SSH_USER}@${SSH_HOST}" \
            "sudo APP_DIR=${DEPLOY_PATH} bash ${DEPLOY_PATH}/deploy/aws/post-deploy.sh"

          echo "Deploy finished successfully."
