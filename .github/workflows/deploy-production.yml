name: Deploy Production (AWS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Deploy to AWS production (SSH/rsync)
        env:
          SSH_HOST: ${{ secrets.AWS_PRODUCTION_HOST }}
          SSH_USER: ${{ secrets.AWS_PRODUCTION_USER }}
          SSH_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.AWS_PRODUCTION_PATH || '/var/www/piko_pop' }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "Skip deploy: AWS_PRODUCTION_HOST, AWS_PRODUCTION_USER, or AWS_SSH_PRIVATE_KEY not set."
            echo "Build succeeded. Add GitHub secrets after AWS server is ready."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'deploy/deploy.config.json' \
            --exclude 'deploy/*.zip' \
            --exclude 'tmp/' \
            --exclude 'application/logs/' \
            --exclude 'uploads/' \
            --exclude '.claude' \
            --exclude 'zbit_local' \
            ./ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${SSH_USER}@${SSH_HOST}" \
            "bash ${DEPLOY_PATH}/deploy/aws/post-deploy.sh"
