name: Deploy Production (AWS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Validate CSS build
        run: |
          npm ci
          npm run build:css

      - name: Deploy to AWS production (git pull)
        env:
          SSH_HOST: ${{ secrets.AWS_PRODUCTION_HOST }}
          SSH_USER: ${{ secrets.AWS_PRODUCTION_USER }}
          SSH_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.AWS_PRODUCTION_PATH || '/var/www/piko_pop' }}
        run: |
          set -euo pipefail

          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "Skip deploy: AWS_PRODUCTION_HOST, AWS_PRODUCTION_USER, or AWS_SSH_PRIVATE_KEY not set."
            exit 0
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" "echo SSH OK"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${SSH_USER}@${SSH_HOST}" \
            "set -euo pipefail
             sudo mkdir -p ${DEPLOY_PATH}
             sudo chown -R ${SSH_USER}:www-data ${DEPLOY_PATH}
             cd ${DEPLOY_PATH}
             if [ ! -d .git ]; then
               git clone -b main https://github.com/suneel999/piko_pop.git ${DEPLOY_PATH}
             fi
             git remote set-url origin https://github.com/suneel999/piko_pop.git
             git fetch origin main
             git checkout main
             git reset --hard origin/main
             npm ci
             npm run build:css
             sudo APP_DIR=${DEPLOY_PATH} bash ${DEPLOY_PATH}/deploy/aws/post-deploy.sh
             echo Deploy complete."
